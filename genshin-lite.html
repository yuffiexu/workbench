<!DOCTYPE html><html lang="zh-CN"><head>

<title>原神 · 极简版 V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block}
#ui{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;padding:10px 14px}
#top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hp-wrap{width:160px}.hp-l{color:#fff;font-size:9px;text-shadow:0 1px 2px rgba(0,0,0,.8)}.hp-b{height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}.hp-f{height:100%;background:linear-gradient(90deg,#5c5,#8e8);border-radius:4px;transition:width .3s}
.st-wrap{width:100px}.st-l{color:#fff;font-size:9px;text-shadow:0 1px 2px rgba(0,0,0,.8)}.st-b{height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}.st-f{height:100%;background:linear-gradient(90deg,#e8c547,#e8a030);border-radius:3px;transition:width .2s}
#bs-hp{display:none;position:fixed;top:80px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:15}
#bs-name{color:#ff6644;font-size:13px;font-weight:800;text-shadow:0 0 10px rgba(255,100,50,.6)}
#bs-bar-wrap{width:260px;height:12px;background:rgba(0,0,0,.6);border-radius:6px;overflow:hidden;border:2px solid rgba(255,100,50,.5);margin-top:3px}
#bs-bar-fill{height:100%;background:linear-gradient(90deg,#ff4422,#ff8844);border-radius:6px;transition:width .3s}
.nums{color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#res-row{display:flex;gap:6px;align-items:center}
.res{display:flex;align-items:center;gap:2px;color:#fff;font-size:9px;background:rgba(0,0,0,.4);padding:2px 7px;border-radius:7px}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;pointer-events:none}
#hint span{background:rgba(0,0,0,.45);color:rgba(255,255,255,.65);font-size:8px;padding:2px 6px;border-radius:5px;white-space:nowrap}
#dmg{position:fixed;pointer-events:none;font-weight:900;font-size:15px;z-index:20;animation:dp .7s forwards}
@keyframes dp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-28px) scale(1.15)}}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:22px;font-weight:900;pointer-events:none;opacity:0;z-index:20;text-shadow:0 0 20px rgba(255,200,50,.8);transition:opacity .15s}
#mobile-ctrl{display:none;position:fixed;bottom:18px;left:0;right:0;padding:0 14px;justify-content:space-between;align-items:flex-end;z-index:10}
#ja{width:115px;height:115px;background:rgba(255,255,255,.04);border-radius:50%;border:2px solid rgba(255,255,255,.08)}#jt{width:40px;height:40px;background:rgba(255,255,255,.14);border-radius:50%;position:absolute;top:50%;left:50%;margin-left:-20px;margin-top:-20px}
.mr{display:flex;gap:6px;flex-wrap:wrap;max-width:130px;justify-content:flex-end}
.mb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mb:active{transform:scale(.82)}#ma{background:rgba(200,60,60,.3)}#mu{background:rgba(200,100,30,.3)}#mj{background:rgba(60,140,200,.3)}
@media(max-width:768px){#mobile-ctrl{display:flex}#hint{display:none}}
</style></head><body>
<div id="ui"><div id="top">
<div class="hp-wrap"><div class="hp-l">❤️</div><div class="hp-b"><div class="hp-f" id="hf" style="width:100%"></div></div></div>
<span class="nums" id="hn">100/100</span>
<div class="st-wrap"><div class="st-l">⚡体力</div><div class="st-b"><div class="st-f" id="sf" style="width:100%"></div></div></div>
<div id="res-row"><div class="res">🪵<span id="wn">0</span></div><div class="res">⭐<span id="bn">0</span></div></div>
</div></div>
<div id="bs-hp"><div id="bs-name">🗿 岩石巨人</div><div id="bs-bar-wrap"><div id="bs-bar-fill" style="width:100%"></div></div></div>
<div id="msg"></div>
<div id="hint"><span>🖱️左键攻击</span><span>🖱️右键重击</span><span>⌨️WASD</span><span>🔵空格跳</span><span>🔥Q大招</span><span>🧗‍♂️靠山自动爬</span><span>1-4换元素</span><span>V切换视角</span><span>🖱️中键转视角</span></div>
<div id="mobile-ctrl"><div id="ja"><div id="jt"></div></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();
scene.background=new THREE.Color().setHSL(.56,.3,.72);
scene.fog=new THREE.Fog(scene.background,60,150);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.2,250);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);

// Sky dome
const sky=new THREE.Mesh(new THREE.SphereGeometry(100,32,16),new THREE.ShaderMaterial({
  vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 p;void main(){float h=normalize(p).y;gl_FragColor=vec4(mix(vec3(.78,.88,.94),vec3(.38,.60,.88),smoothstep(-.15,.65,h)),1.);}',
  side:THREE.BackSide,depthWrite:false
}));scene.add(sky);

// Lighting
const sun=new THREE.DirectionalLight(0xfff8ee,2.8);sun.position.set(40,50,25);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=.3;sun.shadow.camera.far=150;
sun.shadow.camera.left=-50;sun.shadow.camera.right=50;sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;
sun.shadow.bias=-.0002;
scene.add(sun);scene.add(new THREE.AmbientLight(0x8899bb,.9));scene.add(new THREE.HemisphereLight(0x8899cc,0x557744,.6));

// ════════════════ HEIGHTMAP TERRAIN ════════════════
function noise(x,z){return Math.sin(x*.08)*Math.cos(z*.07)*6+Math.sin(x*.15+z*.12)*4+Math.cos(x*.05-z*.09)*8+Math.sin(x*.03)*Math.cos(z*.03)*3;}
function getHeight(x,z){
  let h=noise(x,z);
  // Mountains at edges
  const dist=Math.sqrt(x*x+z*z);
  if(dist>50)h+=(dist-50)*.8;
  if(dist>70)h+=(dist-70)*1.5;
  // A big mountain in one corner
  const mx=x-35,mz=z-30,md=Math.sqrt(mx*mx+mz*mz);
  if(md<18)h+=Math.max(0,(18-md))*1.3;
  // Central plateau
  if(Math.abs(x)<15&&Math.abs(z)<15)h+=2;
  // Valley
  const vx=x+15,vz=z-20,vd=Math.sqrt(vx*vx+vz*vz);
  if(vd<10)h-=(10-vd)*.6;
  return h;
}
const terrainSize=120,terrainSeg=80;
const terrainGeo=new THREE.PlaneGeometry(terrainSize,terrainSize,terrainSeg,terrainSeg);
const tPos=terrainGeo.attributes.position;
const heightData=[];
for(let i=0;i<=terrainSeg;i++){
  heightData[i]=[];
  for(let j=0;j<=terrainSeg;j++){
    const x=(i/terrainSeg-.5)*terrainSize,z=(j/terrainSeg-.5)*terrainSize;
    const h=getHeight(x,z);
    heightData[i][j]=h;
  }
}
for(let i=0;i<tPos.count;i++){
  const x=tPos.getX(i),z=tPos.getY(i);
  const gi=Math.round((x/terrainSize+.5)*terrainSeg),gj=Math.round((z/terrainSize+.5)*terrainSeg);
  const h=heightData[Math.min(terrainSeg,Math.max(0,gi))]?.[Math.min(terrainSeg,Math.max(0,gj))]||0;
  tPos.setZ(i,h);
}
terrainGeo.computeVertexNormals();
const terrainMat=new THREE.MeshStandardMaterial({color:0x6aaf5b,roughness:.85,metalness:0});
const terrain=new THREE.Mesh(terrainGeo,terrainMat);
terrain.rotation.x=-Math.PI/2;terrain.receiveShadow=true;scene.add(terrain);

// Color terrain by height (vertex colors)
const colors=[];
for(let i=0;i<tPos.count;i++){
  const h=tPos.getZ(i);
  const c=new THREE.Color();
  if(h<0)c.setHSL(.28,.5,.35);
  else if(h<3)c.setHSL(.25,.55,.32);
  else if(h<7)c.setHSL(.22,.5,.35);
  else if(h<12)c.setHSL(.15,.3,.45);
  else c.setHSL(.12,.1,.55);
  colors.push(c.r,c.g,c.b);
}
terrainGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(colors),3));
terrainMat.vertexColors=true;

// ════════════════ TREES ════════════════
const choppableTrees=[];
function placeTree(x,z){
  const h=getHeight(x,z);
  if(h<-1||h>15||Math.abs(x)>55||Math.abs(z)>55)return;
  const slope=Math.abs(getHeight(x+.5,z)-getHeight(x-.5,z))+Math.abs(getHeight(x,z+.5)-getHeight(x,z-.5));
  if(slope>4)return;
  const s=.5+Math.random()*1.4;
  const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.22*s,1.8*s,8),new THREE.MeshStandardMaterial({color:0x9B7A4B,roughness:.8}));
  tr.position.y=.9*s+h;tr.castShadow=true;tr.receiveShadow=true;g.add(tr);
  for(let i=0;i<3;i++){
    const lf=new THREE.Mesh(new THREE.SphereGeometry(.8*s-i*.1*s,8,6),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.22+Math.random()*.1,.5,.28+Math.random()*.1),roughness:.7}));
    lf.position.y=1.5*s+i*.6*s+h;lf.castShadow=true;lf.receiveShadow=true;g.add(lf);
  }
  g.position.set(x,0,z);scene.add(g);
  g.userData={hp:6,maxHp:6,wood:3,x,z};
  choppableTrees.push(g);
}
for(let i=0;i<80;i++)placeTree((Math.random()-.5)*100,(Math.random()-.5)*100);
// Near center trees
for(let i=0;i<15;i++)placeTree((Math.random()-.5)*20,(Math.random()-.5)*20);

// Grass tufts
for(let i=0;i<400;i++){
  const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100,h=getHeight(x,z);
  if(h<-1||Math.abs(x)>50||Math.abs(z)>50)continue;
  const b=new THREE.Mesh(new THREE.ConeGeometry(.03,.15+Math.random()*.25,4,2),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(.2+Math.random()*.1,.5,.3+Math.random()*.25)}));
  b.position.set(x,h+.08,z);b.castShadow=true;scene.add(b);
}
// Flowers
for(let i=0;i<120;i++){
  const x=(Math.random()-.5)*80,z=(Math.random()-.5)*80,h=getHeight(x,z);
  if(h<-1||h>12)continue;
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.02,.025,.25,5),new THREE.MeshLambertMaterial({color:0x558833}));
  st.position.set(x,h+.13,z);scene.add(st);
  const pt=new THREE.Mesh(new THREE.SphereGeometry(.08,5,4),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random()<.5?.08:.55+Math.random()*.15,.6,.55)}));
  pt.position.set(x,h+.32,z);scene.add(pt);
}

// Water pond
const pondP=new THREE.Vector3(20,getHeight(20,-6),-6);
const pondM=new THREE.Mesh(new THREE.CircleGeometry(4.5,32),new THREE.MeshPhongMaterial({color:0x3388cc,specular:0xffffff,shininess:90,transparent:true,opacity:.78}));
pondM.rotation.x=-Math.PI/2;pondM.position.copy(pondP);pondM.position.y+=.04;scene.add(pondM);
for(let i=0;i<6;i++){const p=new THREE.Mesh(new THREE.CircleGeometry(.25+Math.random()*.4,10),new THREE.MeshLambertMaterial({color:0x44aa44}));p.rotation.x=-Math.PI/2;p.position.set(18+Math.random()*4,pondP.y+.05,-8+Math.random()*4);scene.add(p);}

// ════════════════ CHARACTER ════════════════
const char=new THREE.Group();
const sc=0xfce0c8,hc=0x3d2520,dc=0x4a7db5,ac=0xe8c547,bc=0x3d2b1f;

// Boots with detail
[-1,1].forEach(s=>{
  const boot=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.38,10),new THREE.MeshStandardMaterial({color:bc,roughness:.6}));
  boot.position.set(s*.13,.17,0);char.add(boot);
  const sole=new THREE.Mesh(new THREE.CylinderGeometry(.15,.14,.06,10),new THREE.MeshStandardMaterial({color:0x2d1b0f,roughness:.4}));
  sole.position.set(s*.13,.03,0);char.add(sole);
  const cuff=new THREE.Mesh(new THREE.TorusGeometry(.15,.035,6,10),new THREE.MeshStandardMaterial({color:ac,roughness:.3,metalness:.3}));
  cuff.position.set(s*.13,.36,0);cuff.rotation.x=Math.PI/2;char.add(cuff);
});
// Legs
[-1,1].forEach(s=>{
  const thigh=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,.48,10),new THREE.MeshLambertMaterial({color:sc}));
  thigh.position.set(s*.13,.42,0);char.add(thigh);
});

// Dress body
const bodice=new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,.65,14),new THREE.MeshStandardMaterial({color:dc,roughness:.5}));
bodice.position.y=.9;bodice.castShadow=true;char.add(bodice);
// Corset detail
const corset=new THREE.Mesh(new THREE.CylinderGeometry(.21,.24,.3,14),new THREE.MeshStandardMaterial({color:0x3a6090,roughness:.4}));
corset.position.y=.85;char.add(corset);
// Gold lacing
for(let i=0;i<3;i++){
  const lace=new THREE.Mesh(new THREE.TorusGeometry(.25,.015,6,14),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.4}));
  lace.position.y=.75+i*.12;lace.rotation.x=Math.PI/2;char.add(lace);
}
// Skirt
const skirtM=new THREE.Mesh(new THREE.CylinderGeometry(.26,.48,.38,18),new THREE.MeshStandardMaterial({color:dc,roughness:.5}));
skirtM.position.y=.58;char.add(skirtM);
const skirtTrim=new THREE.Mesh(new THREE.TorusGeometry(.47,.03,8,18),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.4}));
skirtTrim.position.y=.4;skirtTrim.rotation.x=Math.PI/2;char.add(skirtTrim);
// Back bow
const bowC=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.3}));
bowC.position.set(0,.95,-.3);char.add(bowC);
[-1,1].forEach(s=>{
  const bl=new THREE.Mesh(new THREE.TorusGeometry(.1,.035,6,10),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.3}));
  bl.position.set(s*.14,.95,-.27);bl.rotation.z=s*.9;char.add(bl);
});
// Ribbon tails
[-1,1].forEach(s=>{
  const rt=new THREE.Mesh(new THREE.BoxGeometry(.06,.25,.02),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.3}));
  rt.position.set(s*.12,.78,-.35);rt.rotation.x=.4;rt.rotation.z=s*.5;char.add(rt);
});

// Arms
function mkArm(s){
  const g=new THREE.Group();
  const ua=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.38,10),new THREE.MeshStandardMaterial({color:dc,roughness:.5}));
  ua.position.y=-.12;g.add(ua);
  const fa=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,.32,10),new THREE.MeshLambertMaterial({color:sc}));
  fa.position.y=-.45;g.add(fa);
  // Glove
  const glove=new THREE.Mesh(new THREE.CylinderGeometry(.06,.055,.12,10),new THREE.MeshStandardMaterial({color:bc,roughness:.5}));
  glove.position.y=-.55;g.add(glove);
  const gcuff=new THREE.Mesh(new THREE.TorusGeometry(.065,.02,6,10),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.3}));
  gcuff.position.y=-.48;gcuff.rotation.x=Math.PI/2;g.add(gcuff);
  g.position.set(s*.36,1.1,0);g.rotation.z=s*.2;
  return g;
}
const aL=mkArm(-1),aR=mkArm(1);char.add(aL);char.add(aR);

// Head
const headG=new THREE.Group();headG.position.y=1.55;
const headM=new THREE.Mesh(new THREE.SphereGeometry(.25,22,16),new THREE.MeshLambertMaterial({color:sc}));
headM.castShadow=true;headG.add(headM);
// Neck
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,.15,10),new THREE.MeshLambertMaterial({color:sc}));
neck.position.y=-.12;headG.add(neck);

// Hair - detailed
const hairMain=new THREE.Mesh(new THREE.SphereGeometry(.27,22,10,0,Math.PI*2,0,Math.PI*.52),new THREE.MeshStandardMaterial({color:hc,roughness:.6}));
hairMain.position.y=.03;headG.add(hairMain);
// Bangs
const bangsG=new THREE.Group();
for(let i=-2;i<=2;i++){
  const strand=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),new THREE.MeshStandardMaterial({color:hc,roughness:.6}));
  strand.position.set(i*.1,.13,-.18);strand.scale.set(.6,.35,.4);bangsG.add(strand);
}
headG.add(bangsG);
// Side hair strands
[-1,1].forEach(s=>{
  for(let i=0;i<2;i++){
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(.04,.07,.35,8),new THREE.MeshStandardMaterial({color:hc,roughness:.6}));
    sh.position.set(s*(.2+i*.05),-.05-i*.08,-.08);sh.rotation.z=s*.3;headG.add(sh);
  }
});
// Twin tails
[-1,1].forEach(s=>{
  const tt=new THREE.Group();
  tt.add(new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),new THREE.MeshStandardMaterial({color:hc,roughness:.6}))).position.set(s*.2,-.08,.08);
  const tailM=new THREE.Mesh(new THREE.CylinderGeometry(.05,.09,.55,8),new THREE.MeshStandardMaterial({color:hc,roughness:.6}));
  tailM.position.set(s*.2,-.35,.12);tailM.rotation.x=.45;tailM.rotation.z=s*.55;tt.add(tailM);
  const tailTip=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshStandardMaterial({color:hc,roughness:.6}));
  tailTip.position.set(s*.2,-.55,.32);tt.add(tailTip);
  const ribbon=new THREE.Mesh(new THREE.BoxGeometry(.16,.06,.08),new THREE.MeshStandardMaterial({color:ac,roughness:.2,metalness:.3}));
  ribbon.position.set(s*.2,-.18,.18);tt.add(ribbon);
  headG.add(tt);
});
// Hair accessory (small crown/tiara)
const tiara=new THREE.Mesh(new THREE.TorusGeometry(.18,.02,6,12,Math.PI),new THREE.MeshStandardMaterial({color:ac,roughness:.1,metalness:.6}));
tiara.position.y=.18;tiara.rotation.x=Math.PI/2;tiara.rotation.z=Math.PI;headG.add(tiara);
const tiaraGem=new THREE.Mesh(new THREE.OctahedronGeometry(.04),new THREE.MeshPhongMaterial({color:0x44aadd,specular:0xffffff,shininess:300,emissive:0x114466,emissiveIntensity:.5}));
tiaraGem.position.y=.2;headG.add(tiaraGem);

// Face
[-1,1].forEach(s=>{
  const ew=new THREE.Mesh(new THREE.SphereGeometry(.085,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));
  ew.position.set(s*.1,.06,-.21);headG.add(ew);
  const ir=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),new THREE.MeshBasicMaterial({color:0x4488cc}));
  ir.position.set(s*.1,.055,-.27);headG.add(ir);
  const pu=new THREE.Mesh(new THREE.SphereGeometry(.035,6,4),new THREE.MeshBasicMaterial({color:0x111122}));
  pu.position.set(s*.1,.055,-.30);headG.add(pu);
  const hl=new THREE.Mesh(new THREE.SphereGeometry(.02,4,3),new THREE.MeshBasicMaterial({color:0xffffff}));
  hl.position.set(s*.1+.022,.075,-.29);headG.add(hl);
  // Eyelashes
  const lash=new THREE.Mesh(new THREE.BoxGeometry(.07,.012,.01),new THREE.MeshBasicMaterial({color:0x111122}));
  lash.position.set(s*.1,.11,-.27);headG.add(lash);
  // Blush
  const bl=new THREE.Mesh(new THREE.CircleGeometry(.055,8),new THREE.MeshBasicMaterial({color:0xffaaaa,transparent:true,opacity:.45,depthWrite:false}));
  bl.position.set(s*.17,-.02,-.16);headG.add(bl);
});
// Small mouth
const mth=new THREE.Mesh(new THREE.TorusGeometry(.035,.01,6,8,Math.PI),new THREE.MeshBasicMaterial({color:0xcc7777}));
mth.position.set(0,-.06,-.23);mth.rotation.z=Math.PI;headG.add(mth);
// Nose (tiny)
const nose=new THREE.Mesh(new THREE.SphereGeometry(.025,6,4),new THREE.MeshLambertMaterial({color:0xf5d5c0}));
nose.position.set(0,.025,-.24);headG.add(nose);

char.add(headG);

// Cape
const capeG=new THREE.Group();
const capeM=new THREE.Mesh(new THREE.PlaneGeometry(.45,.65,6,4),new THREE.MeshStandardMaterial({color:0xcc3333,side:THREE.DoubleSide,roughness:.6}));
capeM.position.set(0,1.05,-.32);capeM.rotation.x=-.2;capeG.add(capeM);
// Cape clasp
const clasp=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),new THREE.MeshStandardMaterial({color:ac,roughness:.1,metalness:.5}));
clasp.position.set(0,1.3,-.22);capeG.add(clasp);
char.add(capeG);

const boss={alive:false,hp:200,maxHp:200,x:0,z:0,g:null,_cd:0,_phase:0,spawnTimer:15};
function createBoss(){
  if(boss.g)scene.remove(boss.g);
  const g=new THREE.Group();
  // Body
  const bodyG=new THREE.BoxGeometry(1.2,1.8,1,4,4,4);

  const bp=bodyG.attributes.position;
  for(let i=0;i<bp.count;i++){bp.setX(i,bp.getX(i)+(Math.random()-.5)*.25);bp.setY(i,bp.getY(i)+(Math.random()-.5)*.3);bp.setZ(i,bp.getZ(i)+(Math.random()-.5)*.2);}
  bodyG.computeVertexNormals();
  const bodyM=new THREE.Mesh(bodyG,new THREE.MeshStandardMaterial({color:0x887766,roughness:.7}));
  bodyM.position.y=1.2;bodyM.castShadow=true;g.add(bodyM);
  // Core glow
  const core=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),new THREE.MeshBasicMaterial({color:0xff6622}));
  core.position.y=1.2;g.add(core);
  // Shoulders
  [-1,1].forEach(s=>{
    const sh=new THREE.Mesh(new THREE.SphereGeometry(.45,8,6),new THREE.MeshStandardMaterial({color:0x998877,roughness:.6}));

  });
  // Head
  const headB=new THREE.Mesh(new THREE.BoxGeometry(.7,.6,.5,4,4,4),new THREE.MeshStandardMaterial({color:0x776655,roughness:.6}));
  headB.position.y=2.5;headB.castShadow=true;g.add(headB);
  // Eyes (glowing)
  [-1,1].forEach(s=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),new THREE.MeshBasicMaterial({color:0xff4400}));
    eye.position.set(s*.18,2.6,-.25);g.add(eye);
  });
  // Arms
  [-1,1].forEach(s=>{
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,.9,8),new THREE.MeshStandardMaterial({color:0x887766,roughness:.6}));
    arm.position.set(s*1.1,1.5,0);arm.rotation.z=s*.4;arm.castShadow=true;g.add(arm);
    const fist=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),new THREE.MeshStandardMaterial({color:0x776655,roughness:.5}));
    fist.position.set(s*1.35,.85,0);fist.castShadow=true;g.add(fist);
  });
  // Legs
  [-1,1].forEach(s=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,.7,8),new THREE.MeshStandardMaterial({color:0x665544,roughness:.7}));
    leg.position.set(s*.3,.4,0);leg.castShadow=true;g.add(leg);
  });
  // Crown/spikes
  for(let i=0;i<5;i++){
    const spike=new THREE.Mesh(new THREE.ConeGeometry(.12,.4,6),new THREE.MeshStandardMaterial({color:0x554433,roughness:.5}));
    spike.position.set((i-2)*.2,2.1,-.2);spike.rotation.x=-.3;g.add(spike);
  }
  // Shadow
  const bShadow=new THREE.Mesh(new THREE.CircleGeometry(.9,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false}));
  bShadow.rotation.x=-Math.PI/2;bShadow.position.y=.02;g.add(bShadow);

  const nx=(Math.random()-.5)*60,nz=(Math.random()-.5)*60;
  g.position.set(nx,getHeight(nx,nz),nz);
  scene.add(g);
  boss.g=g;boss.alive=true;boss.hp=boss.maxHp;boss._cd=0;boss._phase=0;
  document.getElementById('bs-hp').style.display='block';
}
function updateBoss(dt,pp){
  if(!boss.alive||!boss.g)return;
  const dx=boss.g.position.x-pp.x,dz=boss.g.position.z-pp.z,dist=Math.sqrt(dx*dx+dz*dz);
  boss._cd-=dt;
  // Always face player
  boss.g.lookAt(pp.x,boss.g.position.y,pp.z);

  if(dist>3&&dist<25){
    // Chase
    boss.g.position.x-=(dx/dist)*3.5*dt;
    boss.g.position.z-=(dz/dist)*3.5*dt;
  }
  // Ground slam
  if(dist<5&&boss._cd<=0){
    boss._cd=2.5;
    spawnFire(boss.g.position.clone().add(new THREE.Vector3(0,.5,0)),25);
    if(dist<5){hp=Math.max(0,hp-15);updateHUD();spawnParts(char.position.clone().add(new THREE.Vector3(0,1,0)),0xff4422,15,3);}
  }
  // Rock throw (phase 2)
  if(boss.hp<100&&dist>5&&dist<20&&boss._cd<=0){
    boss._cd=3;
    // Spawn flying rock particles toward player
    for(let i=0;i<10;i++){
      const rockP=new THREE.Mesh(new THREE.IcosahedronGeometry(.15,1),new THREE.MeshBasicMaterial({color:0x887766}));
      rockP.position.copy(boss.g.position);rockP.position.y+=2;
      const dir=new THREE.Vector3(pp.x-rockP.position.x,.5,pp.z-rockP.position.z).normalize();
      const v=dir.clone().multiplyScalar(12);
      scene.add(rockP);bossRocks.push({m:rockP,v,l:1});
    }
  }
  // Keep on terrain
  const h=getHeight(boss.g.position.x,boss.g.position.z);
  boss.g.position.y=h;

  // Boss HP bar
  document.getElementById('bs-bar-fill').style.width=(boss.hp/boss.maxHp*100)+'%';
  if(dist>30)document.getElementById('bs-hp').style.display='none';
  else document.getElementById('bs-hp').style.display='block';

  // Dead
  if(boss.hp<=0&&boss.alive){
    boss.alive=false;
    for(let i=0;i<40;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.15,5,5),new THREE.MeshBasicMaterial({color:0xff8844}));p.position.copy(boss.g.position);p.position.y+=1+Math.random()*3;deadPs.push({m:p,v:new THREE.Vector3((Math.random()-.5)*6,3+Math.random()*7,(Math.random()-.5)*6),l:1.2});scene.add(p);}
    scene.remove(boss.g);boss.g=null;
    document.getElementById('bs-hp').style.display='none';
    bossReward++;document.getElementById('bn').textContent=bossReward;
    showMsg('⭐ Boss击败！+1');
    boss.spawnTimer=60+Math.random()*60;
  }
}

// ════════════════ GAME LOOP ════════════════
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.2);
  // Spawn timer
  boss.spawnTimer-=dt;
  if(boss.spawnTimer<=0&&!boss.alive){createBoss();boss.spawnTimer=60+Math.random()*90;}

  // Input
  let ix=0,iz=0;if(keys['w'])iz=1;if(keys['s'])iz=-1;if(keys['a'])ix=-1;if(keys['d'])ix=1;if(tJoy){ix=tJoy.x;iz=tJoy.y;}
  const moving=Math.abs(ix)>.1||Math.abs(iz)>.1;

  // View toggle
  if(keys['v']&&!keys._v){keys._v=true;viewMode=viewMode==='third'?'first':'third';showMsg(viewMode==='first'?'👁️ 第一人称':'👁️ 第三人称');}if(!keys['v'])keys._v=false;
  // Element switch
  [1,2,3,4].forEach(n=>{if(keys[String(n)])currentElem=['pyro','hydro','electro','cryo'][n-1];});

  // Movement
  const fwd=new THREE.Vector3(Math.sin(cTheta),0,Math.cos(cTheta)),rgt=new THREE.Vector3(Math.cos(cTheta),0,-Math.sin(cTheta));
  const mDir=new THREE.Vector3();if(ix)mDir.add(rgt.clone().multiplyScalar(ix));if(iz)mDir.add(fwd.clone().multiplyScalar(iz));if(mDir.length()>1)mDir.normalize();

  // Detect climbing (steep slope in front)
  const frontX=char.position.x+fwd.x*1.5,frontZ=char.position.z+fwd.z*1.5;
  const frontH=getHeight(frontX,frontZ);
  const curH=getHeight(char.position.x,char.position.z);
  const slopeAngle=Math.atan2(Math.abs(frontH-curH),1.5);
  isClimbing=false;
  if(slopeAngle>.8&&iz>0&&stamina>0&&char.position.y<frontH){
    isClimbing=true;
    char.position.y+=(frontH-curH)*dt*3;
    stamina=Math.max(0,stamina-25*dt);
    pVel.y=0;
  }

  const spd=keys['shift']?8:4.5;
  pVel.x+=(mDir.x*spd-pVel.x)*Math.min(dt*7,1);
  pVel.z+=(mDir.z*spd-pVel.z)*Math.min(dt*7,1);
  if(moving&&mDir.length()>.1&&!isClimbing){const ta=Math.atan2(mDir.x,mDir.z);let d=ta-charRotY;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;charRotY+=d*Math.min(dt*12,1);}
  char.rotation.y=charRotY;

  if((keys[' ']||keys['space'])&&char.position.y<=getHeight(char.position.x,char.position.z)+.1&&!isClimbing)pVel.y=8;
  pVel.y-=18*dt;
  char.position.x+=pVel.x*dt;char.position.z+=pVel.z*dt;
  char.position.y+=pVel.y*dt;
  const groundH=getHeight(char.position.x,char.position.z);
  if(char.position.y<groundH){char.position.y=groundH;pVel.y=0;}
  char.position.x=Math.max(-58,Math.min(58,char.position.x));char.position.z=Math.max(-58,Math.min(58,char.position.z));

  // Stamina regen
  if(!isClimbing)stamina=Math.min(100,stamina+15*dt);

  // Cape & idle
  capeM.rotation.z=Math.sin(Date.now()*.004)*.12-pVel.x*.06;
  if(!moving&&char.position.y<=groundH+.1)headG.position.y=1.55+Math.sin(Date.now()*.003)*.03;
  else headG.position.y+=(1.55-headG.position.y)*.1;

  // ── ATTACK ──
  atkCd=Math.max(0,atkCd-dt);heavyCd=Math.max(0,heavyCd-dt);ultCd=Math.max(0,ultCd-dt);
  const atkFwd=new THREE.Vector3(Math.sin(charRotY),0,Math.cos(charRotY));
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)comboStep=0;}

  if((mD||tAtk)&&atkCd<=0&&!isAtk&&!isHeavy){
    atkCd=.4;isAtk=true;atkTimer=.22;comboStep=(comboStep%3)+1;comboTimer=.8;wpn.visible=true;
    if(comboStep===1){showMsg('⚔️');spawnParts(char.position.clone().add(new THREE.Vector3(0,1,0)).add(atkFwd.clone().multiplyScalar(1)),0xffffcc,8,1.5);}
    else if(comboStep===2){showMsg('⚔️⚔️');spawnParts(char.position.clone().add(new THREE.Vector3(0,1,0)).add(atkFwd.clone().multiplyScalar(1)),0xffffcc,12,2);}
    else{showMsg('💥3连击！');spawnParts(char.position.clone().add(new THREE.Vector3(0,1,0)).add(atkFwd.clone().multiplyScalar(1.5)),0xffdd44,18,2.5);}
    // Hit slimes
    for(const sl of slimes){if(!sl.alive)continue;const d=char.position.distanceTo(sl.g.position);if(d<3.5&&atkFwd.dot(sl.g.position.clone().sub(char.position).normalize())>.2){const dmg=(12+Math.floor(Math.random()*8))*comboStep;const k=sl.hit(dmg);dmgPop(sl.g.position,dmg);if(k)spawnParts(sl.g.position.clone().add(new THREE.Vector3(0,.4,0)),0xffffff,10);}}
    // Hit boss
    if(boss.alive&&boss.g){const d=char.position.distanceTo(boss.g.position);if(d<5&&atkFwd.dot(boss.g.position.clone().sub(char.position).normalize())>.2){const dmg=(8+Math.floor(Math.random()*6))*comboStep;boss.hp-=dmg;dmgPop(boss.g.position.clone().add(new THREE.Vector3(0,2,0)),dmg);spawnParts(boss.g.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff8844,8,2);}}
    // Chop trees
    for(const tree of choppableTrees){if(!tree.visible||tree.userData.hp<=0)continue;const tp=new THREE.Vector3(tree.position.x,tree.position.y+1,tree.position.z);if(char.position.distanceTo(tp)<4&&atkFwd.dot(tp.clone().sub(char.position).normalize())>.3){tree.userData.hp-=(1+comboStep);spawnParts(tp,0x9B7A4B,6,1.5);tree.position.x+=(Math.random()-.5)*.1;tree.position.z+=(Math.random()-.5)*.1;setTimeout(()=>{tree.position.set(tree.userData.x,0,tree.userData.z)},200);if(tree.userData.hp<=0){wood+=tree.userData.wood;document.getElementById('wn').textContent=wood;spawnParts(tp,0x8B6914,15,3);tree.userData.hp=-99;tree.visible=false;setTimeout(()=>{tree.userData.hp=6;tree.visible=true;tree.position.set(tree.userData.x,0,tree.userData.z)},12000);dmgPop(tp,0,'🪵+'+tree.userData.wood);}}}
  }
  // Heavy
  if((rD)&&heavyCd<=0&&!isAtk&&!isHeavy){
    heavyCd=1.2;isHeavy=true;heavyTimer=.4;wpn.visible=true;showMsg('💪重击！');
    spawnParts(char.position.clone().add(new THREE.Vector3(0,1,0)).add(atkFwd.clone().multiplyScalar(1.5)),0xffaa44,20,3);
    for(const sl of slimes){if(!sl.alive)continue;const d=char.position.distanceTo(sl.g.position);if(d<5&&atkFwd.dot(sl.g.position.clone().sub(char.position).normalize())>.15){const dmg=30+Math.floor(Math.random()*20);const k=sl.hit(dmg);dmgPop(sl.g.position,dmg,'#ff8800');if(k)spawnParts(sl.g.position.clone().add(new THREE.Vector3(0,.4,0)),0xff8800,15,3);}}
    if(boss.alive&&boss.g&&char.position.distanceTo(boss.g.position)<6){const dmg=25+Math.floor(Math.random()*20);boss.hp-=dmg;dmgPop(boss.g.position.clone().add(new THREE.Vector3(0,2,0)),dmg,'#ff8800');spawnParts(boss.g.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff8800,12,3);}
    for(const tree of choppableTrees){if(!tree.visible||tree.userData.hp<=0)continue;const tp=new THREE.Vector3(tree.position.x,tree.position.y+1,tree.position.z);if(char.position.distanceTo(tp)<5){tree.userData.hp-=3;spawnParts(tp,0x8B6914,12,3);if(tree.userData.hp<=0){wood+=tree.userData.wood;document.getElementById('wn').textContent=wood;spawnParts(tp,0x8B6914,20,4);tree.userData.hp=-99;tree.visible=false;setTimeout(()=>{tree.userData.hp=6;tree.visible=true;tree.position.set(tree.userData.x,0,tree.userData.z)},12000);dmgPop(tp,0,'🪵+'+tree.userData.wood);}}}
  }
  // Sword anim
  if(atkTimer>0){atkTimer-=dt;const t=atkTimer/.22;wpn.rotation.z=-.55+Math.sin((1-t)*Math.PI)*(comboStep===3?4:3);if(atkTimer<=0){wpn.visible=false;isAtk=false;wpn.rotation.z=-.55;}}
  if(heavyTimer>0){heavyTimer-=dt;const t=heavyTimer/.4;wpn.rotation.z=-.55+Math.sin((1-t)*Math.PI)*4.5;wpn.position.x=.48+Math.sin((1-t)*Math.PI)*.3;if(heavyTimer<=0){wpn.visible=false;isHeavy=false;wpn.rotation.z=-.55;wpn.position.x=.4;}}

  // ── ULTIMATE ──
  if((keys['q']||tUlt)&&ultCd<=0){
    ultCd=5;const sp=char.position.clone();sp.y+=1.2;showMsg('🔥💧⚡❄️ 元素爆发！');spawnFire(sp,40);
    for(const sl of slimes){if(!sl.alive||char.position.distanceTo(sl.g.position)>8)continue;const dmg=50+Math.floor(Math.random()*30);const k=sl.hit(dmg);dmgPop(sl.g.position,dmg,'#ff4400');if(k)spawnParts(sl.g.position.clone().add(new THREE.Vector3(0,.4,0)),0xff6600,15,4);}
    if(boss.alive&&boss.g&&char.position.distanceTo(boss.g.position)<10){const dmg=60+Math.floor(Math.random()*40);boss.hp-=dmg;dmgPop(boss.g.position.clone().add(new THREE.Vector3(0,2,0)),dmg,'#ff4400');spawnParts(boss.g.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff6600,20,5);}
    camera.position.x+=(Math.random()-.5)*.6;camera.position.y+=(Math.random()-.5)*.6;
  }
  tUlt=false;

  // ── Update entities ──
  for(const sl of slimes){sl.update(dt,char.position);if(!sl.alive||sl._hCd>0)continue;if(char.position.distanceTo(sl.g.position)<1.6){sl._hCd=1;hp=Math.max(0,hp-5);updateHUD();spawnParts(char.position.clone().add(new THREE.Vector3(0,1,0)),0xff4444,6);}}
  updateBoss(dt,char.position);
  // Boss rocks
  for(let i=bossRocks.length-1;i>=0;i--){const r=bossRocks[i];r.l-=dt;if(r.l<=0){scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();bossRocks.splice(i,1);}else{r.m.position.add(r.v.clone().multiplyScalar(dt));r.v.y-=8*dt;if(char.position.distanceTo(r.m.position)<1.5){hp=Math.max(0,hp-8);updateHUD();spawnParts(r.m.position,0xff8844,6);scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();bossRocks.splice(i,1);}}}

  // Particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();parts.splice(i,1);}else{p.m.position.add(p.v.clone().multiplyScalar(dt));p.v.y-=5*dt;}}
  for(let i=deadPs.length-1;i>=0;i--){const p=deadPs[i];p.l-=dt;if(p.l<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();deadPs.splice(i,1);}else{p.m.position.add(p.v.clone().multiplyScalar(dt));p.v.y+=3*dt;}}

  // Camera
  if(viewMode==='third'){
    const cp=new THREE.Vector3(char.position.x-Math.sin(cTheta)*Math.cos(cPhi)*cDist,char.position.y+2.5+Math.sin(cPhi)*cDist,char.position.z-Math.cos(cTheta)*Math.cos(cPhi)*cDist);
    camera.position.lerp(cp,.1);camera.lookAt(char.position.x,char.position.y+1.3,char.position.z);
  }else{
    camera.position.lerp(new THREE.Vector3(char.position.x,char.position.y+1.5,char.position.z),.15);
    camera.lookAt(char.position.x+Math.sin(cTheta)*10,char.position.y+1.3,char.position.z+Math.cos(cTheta)*10);
    if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();
  }
  renderer.domElement.onclick=()=>{if(viewMode==='first'&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();};
  document.addEventListener('mousemove',e=>{if(viewMode==='first'&&document.pointerLockElement===renderer.domElement){cTheta-=e.movementX*.003;cPhi=Math.max(-.4,Math.min(.8,cPhi-e.movementY*.002));}});

  sDisk.position.set(char.position.x,.02,char.position.z);
  updateHUD();
  renderer.render(scene,camera);
}

// Spawn initial slimes
for(let i=0;i<15;i++)new Slime((Math.random()-.5)*70,(Math.random()-.5)*70,slColors[i%5]);

let currentElem='pyro';
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
console.log('🎮 V4 就绪！山脉地形🗻 | 攀爬🧗 | Boss🗿 | 新史莱姆👾 | 新人物建模👧');
</script></body></html>
